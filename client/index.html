<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Socket.IO Chat</title>
    <style>
      body {
        margin: 0;
        padding-bottom: 3rem;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
      }

      #messages {
        list-style-type: none;
        margin: 0;
        padding: 0;
      }
      #messages > li {
        padding: 0.5rem 1rem;
        clear: both;
      }

      #form {
        background: rgba(0, 0, 0, 0.15);
        padding: 0.25rem;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        display: flex;
        height: 3rem;
        box-sizing: border-box;
        backdrop-filter: blur(10px);
      }
      #input {
        border: none;
        padding: 0 1rem;
        flex-grow: 1;
        border-radius: 2rem;
        margin: 0.25rem;
      }
      #input:focus {
        outline: none;
      }
      #form > button {
        background: #333;
        border: none;
        padding: 0 1rem;
        margin: 0.25rem;
        border-radius: 3px;
        outline: none;
        color: #fff;
      }

      #typing {
        font-style: italic;
        margin: 0.5rem 1rem;
        color: gray;
      }

      .message {
        max-width: 70%;
        margin: 0.3rem 1rem;
        padding: 0.5rem 1rem;
        border-radius: 1rem;
        display: inline-block;
      }

      .self {
        background-color: #dcf8c6;
        float: right;
      }

      .other {
        background-color: #f1f0f0;
        float: left;
      }
    </style>
  </head>
  <body>
    <ul id="messages"></ul>
    <p id="typing"></p>
    <form id="form" action="">
      <input id="input" autocomplete="off" placeholder="Type your message..." />
      <button>Send</button>
    </form>

    <script src="/socket.io/socket.io.js"></script>
    <script>
      const socket = io("http://192.168.0.109:3000");
      const form = document.getElementById("form"); //192.168.0.109
      const input = document.getElementById("input");
      const messages = document.getElementById("messages");
      const typing = document.getElementById("typing");

      const username = prompt("Enter your name:");
      socket.emit("new user", username);

      const joinMsg = document.createElement("li");
      joinMsg.textContent = `chatga qoshildi`;
      joinMsg.style.fontStyle = "italic";
      joinMsg.style.color = "blue";
      messages.appendChild(joinMsg);

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        if (input.value) {
          socket.emit("chat message", { user: username, msg: input.value });
          input.value = "";
        }
      });

      socket.on("chat message", (data) => {
        const item = document.createElement("li");
        item.classList.add("message");

        if (data.user === username) {
          item.classList.add("self");
          item.textContent = `You: ${data.msg}`;
        } else {
          item.classList.add("other");
          item.textContent = `${data.user}: ${data.msg}`;
        }

        messages.appendChild(item);
        window.scrollTo(0, document.body.scrollHeight);
      });

      socket.on("user joined", (user) => {
        const item = document.createElement("li");
        item.textContent = `${user} chatga qoshildi`;
        item.style.fontStyle = "italic";
        item.style.color = "green";
        messages.appendChild(item);
      });

      let typingTimeout;
      input.addEventListener("input", () => {
        socket.emit("typing", username);
        clearTimeout(typingTimeout);
        typingTimeout = setTimeout(() => {
          socket.emit("stop typing");
        }, 1000);
      });

      socket.on("typing", (user) => {
        if (user !== username) {
          typing.textContent = `${user} yozyapti...`;
        }
      });

      socket.on("stop typing", () => {
        typing.textContent = "";
      });
    </script>
  </body>
</html>
